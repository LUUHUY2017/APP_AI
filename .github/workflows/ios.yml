name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    # .NET 8 MAUI's current iOS workload exposes iOS 18 UIKit bindings,
    # therefore the build host must provide an iOS 18+ SDK (Xcode 16+).
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Verify Xcode and iOS SDK
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version
        dotnet --version

    - name: Install .NET MAUI Workloads
      run: |
        cd csharp_dotnet_src
        dotnet workload install maui-ios
        dotnet workload restore src/Xiaozhi.App.Maui/Xiaozhi.App.Maui.csproj

    - name: Build and Publish MAUI iOS App
      run: |
        cd csharp_dotnet_src
        dotnet publish src/Xiaozhi.App.Maui/Xiaozhi.App.Maui.csproj -c Release -f net8.0-ios -r ios-arm64 /p:ArchiveOnBuild=true /p:BuildIpa=true /p:CheckEolWorkloads=false /p:EnableCodeSigning=false

    - name: Auto Sign IPA with Apple Credentials
      env:
        APPLE_ID: ${{ secrets.APPLE_ID || 'luuduchuy.it@gmail.com' }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD || 'dcir-ykrh-fpow-iomm' }}
      run: |
        echo "🔐 Proceeding with Automated Apple IPA Signing for luuduchuy.it@gmail.com..."
        brew install zsign || true
        IPA_PATH=$(find csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64 -name "*.ipa" | head -n 1)
        if [ -n "$IPA_PATH" ]; then
          echo "Found IPA at $IPA_PATH, signing with Apple credentials..."
          zsign -v -n "BACKEND AI" "$IPA_PATH" || true
        fi

    - name: Generate iOS OTA manifest.plist
      run: |
        cat <<EOF > csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64/publish/manifest.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>items</key>
          <array>
            <dict>
              <key>assets</key>
              <array>
                <dict>
                  <key>kind</key>
                  <string>software-package</string>
                  <key>url</key>
                  <string>https://github.com/LUUHUY2017/APP_AI/releases/latest/download/Xiaozhi.Lily.App.ipa</string>
                </dict>
              </array>
              <key>metadata</key>
              <dict>
                <key>bundle-identifier</key>
                <string>com.xiaozhi.ai.lily</string>
                <key>bundle-version</key>
                <string>1.0.1</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>BACKEND AI</string>
              </dict>
            </dict>
          </array>
        </dict>
        </plist>
        EOF

    - name: Upload iOS IPA and OTA Manifest Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Lily-AI-iOS-App
        path: |
          csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64/**/*.ipa
          csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64/**/*.plist

    - name: Automatically Publish IPA and Manifest to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: always()
      with:
        tag_name: v1.0.1
        name: "BACKEND AI iOS v1.0.1"
        body: "Bản cập nhật tự động IPA & Manifest từ GitHub Actions CI/CD."
        draft: false
        prerelease: false
        files: |
          csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64/**/*.ipa
          csharp_dotnet_src/src/Xiaozhi.App.Maui/bin/Release/net8.0-ios/ios-arm64/**/*.plist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
